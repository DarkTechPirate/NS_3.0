server {
    listen 3000 default_server;
    server_name _;
    root /app/frontend/build;
    index index.html;

    # Diagnostic Headers
    add_header X-Debug-Source "container-nginx-simplified" always;

    # Gzip Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    # 1. Direct Nginx Health Check (Bypasses Backend)
    location /nginx-health {
        access_log off;
        return 200 "nginx-is-alive";
    }

    # 2. Immutable Assets (Vite hashes these)
    location ~* \.(?:js|mjs|css|woff2?|eot|ttf|otf|map)$ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # 3. Static Images & Media
    location ~* \.(?:jpg|jpeg|gif|png|ico|svg|webp|avif|mp4|webm)$ {
        expires 30d;
        access_log off;
        add_header Cache-Control "public, no-transform";
        try_files $uri $uri/ @backend;
    }

    # 4. API & Uploads
    location /api {
        try_files $uri @backend;
    }

    location /uploads {
        try_files $uri @backend;
    }

    # WebSocket Support (Socket.io)
    location /ws/ {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 5. Frontend Routing (React)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 6. Backend Fallback
    location @backend {
        # Diagnostic Headers
        add_header X-Debug-Source "container-nginx-v5" always;
        add_header X-Backend-Status "proxying" always;

        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Security Headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header X-Content-Type-Options "nosniff" always;

        # Timeouts
        proxy_connect_timeout 90s;
        proxy_send_timeout 90s;
        proxy_read_timeout 90s;
    }
}
