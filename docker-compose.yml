version: '3.8'

services:
  backend:
    build:
      context: ./backend
    container_name: ns_backend
    restart: always
    ports:
      - "3002:5000" # Backend API
      - "3003:5000" # Socket.io
    env_file:
      - ./backend/.env # <-- Tell Docker to load the env file directly into the container
    environment:
      - PORT=5000
      # You can remove all the ${VARIABLE} mappings here since env_file handles it

  frontend:
    build:
      context: ./frontend
      args:
        - VITE_API_URL=${VITE_API_URL:-http://localhost:3002/api}
        - VITE_SOCKET_URL=${VITE_SOCKET_URL:-http://localhost:3003}
    container_name: ns_frontend
    restart: always
    ports:
      - "5001:80"
    depends_on:
      - backend
