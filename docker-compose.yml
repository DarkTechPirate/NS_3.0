services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    # Use port 5002 as the host port to avoid conflicts with other services
    ports:
      - "5002:5000"
    networks:
      - infra_internal
    # Automatically load all variables from the backend's .env file
    env_file:
      - ./backend/.env
    environment:
      PORT: 5000
      NODE_ENV: production

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "5178:5178"
    networks:
      - infra_internal
    # Load frontend-specific variables if a .env file exists in the frontend directory
    env_file:
      - ./frontend/.env
    depends_on:
      - backend

networks:
  infra_internal:
    external: true
