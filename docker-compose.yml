version: "3.9"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ns_30-app
    restart: unless-stopped
    ports:
      - "127.0.0.1:3002:3000"
    networks:
      - infra_internal
    env_file:
      - ./backend/.env
    environment:
      PORT: 3002
      NODE_ENV: production
    cpus: "1.0"
    mem_limit: 1.5g

networks:
  infra_internal:
    external: true
